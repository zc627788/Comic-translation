[project]
name = "comic-translation-services"
version = "0.0.1"
description = "Local foundation for the manga translation service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
